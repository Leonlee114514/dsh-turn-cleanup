name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # 本插件只用 node 内建模块（fs/promises、path、crypto、os），没有运行时依赖。
      # 所以这里不跑 npm ci —— 没有依赖可装，跑了只是浪费。
      - name: Syntax check
        run: |
          set -e
          for f in lib/*.js test/*.mjs; do
            node --check "$f"
          done

      - name: Module loads and exports the plugin contract
        run: |
          node --input-type=module -e "
            const m = await import('./lib/index.js');
            for (const k of ['name', 'inject', 'apply']) {
              if (!(k in m)) { console.error('missing export: ' + k); process.exit(1); }
            }
            if (m.name !== 'dsh-turn-cleanup') { console.error('bad name: ' + m.name); process.exit(1); }
            if (!Array.isArray(m.inject)) { console.error('inject must be an array'); process.exit(1); }
            if (typeof m.apply !== 'function') { console.error('apply must be a function'); process.exit(1); }
            console.log('exports ok:', m.name, 'inject=' + JSON.stringify(m.inject));
          "

      # 假 ctx 模拟 agent-loop 的调用顺序，不依赖 DSH 运行时。
      # 覆盖：正例 / 约定目录 / 交付物反例 / 存量反例 / 防抖 / 子会话 / 禁用 /
      #       备份保留（steer 与 prune 两种模式）/ protectedSegments / 三个 intent 事件 /
      #       messageLocale / workingDirectory 与 realpath 归一 / 备份家族识别 /
      #       scanDepth / tmpDirName 归一 / mtimeToleranceMs / maxPrunePerTurn。
      - name: Behaviour simulation
        run: node test/sim.mjs

      # 下面四个也必须在 CI 里跑，只在本机 npm test 里跑等于把最容易随宿主升级
      # 漂移的几块留在没人看的角落：web.mjs 验路由（含 405/400 与并发写账本），
      # client.mjs 验浏览器 bundle 契约，report.mjs 验工具与账本损坏/并发自愈，
      # tool-agnostic.mjs 验「不依赖具体工具名」的路径提取。
      - name: Web panel route (fake webServer, no socket)
        run: node test/web.mjs

      - name: Client bundle contract (fake __ModuleLoader__)
        run: node test/client.mjs

      - name: Ledger, tool and self-healing (real fs, temp dirs)
        run: node test/report.mjs

      - name: Tool-agnostic path harvesting
        run: node test/tool-agnostic.mjs

      # 回归现场：gate(N) 与 auto(N+1) 撞同一个复核点、同轮 gate+auto 的 recent、
      # 纯 auto 账本的拦截计数、带引号的含空格路径、多链接文件的体积。
      # 这几条在别的套件里构造不出来，所以它们曾经全绿而缺陷仍在。
      - name: Regression cases from AUDIT-logic.md
        run: node test/regress.mjs

      # 插件必须能在任何 OS 上跑：路径分隔符、大小写敏感性、临时目录位置都不同。
      - name: Manifest is well-formed
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            if (pkg.name !== 'dsh-turn-cleanup') { console.error('bad name'); process.exit(1); }
            if (pkg.type !== 'module') { console.error('must be ESM'); process.exit(1); }
            if (pkg.main !== 'lib/index.js') { console.error('bad main'); process.exit(1); }
            if (!pkg.exports?.['.']) { console.error('missing exports[\".\"]'); process.exit(1); }
            console.log('manifest ok:', pkg.version);
          "

  # Windows 是 DSH 桌面的主力平台，路径语义（反斜杠、盘符、大小写）跟 Linux 差得最多。
  # 只在 ubuntu 上跑等于没验跨平台。
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in lib/*.js test/*.mjs; do
            node --check "$f"
          done

      # realpath / junction 归一在 Windows 上最容易翻车：sim.mjs 里场景 25 建目录联接，
      # 建不出来会打 SKIP 而不是 FAIL —— CI 必须把两者区分开，否则真回归会被当成跳过。
      - name: Behaviour simulation
        run: node test/sim.mjs

      - name: Web panel route (fake webServer, no socket)
        run: node test/web.mjs

      - name: Client bundle contract (fake __ModuleLoader__)
        run: node test/client.mjs

      - name: Ledger, tool and self-healing (real fs, temp dirs)
        run: node test/report.mjs

      - name: Tool-agnostic path harvesting
        run: node test/tool-agnostic.mjs

      # Windows 是含空格路径与多链接文件最真实的地方：用户目录常带空格，
      # Git worktree / pnpm store 大量用硬链接。
      - name: Regression cases from AUDIT-logic.md
        run: node test/regress.mjs
