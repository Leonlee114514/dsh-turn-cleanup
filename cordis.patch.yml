# dsh-turn-cleanup — bundle manifest entry.
#
# Install:
#
#   dsh plugin --profile <profile> add dsh-turn-cleanup
#   dsh plugin --profile <profile> add github:Leonlee114514/dsh-turn-cleanup
#
# ---------------------------------------------------------------------------
# Why this file contains NOTHING but `id` and `name`
# ---------------------------------------------------------------------------
# The market hot-mounts a freshly installed plugin so it goes live without a
# restart. It does that by replaying the patch's plain insert rows, and it
# refuses the whole patch when it meets any other key:
#
#   dshmarket/lib/hot.js  scanPatch()
#     key === 'config'                 → blocker 'config'
#     key === 'disabled' | 'enabled'   → blocker 'disabled'
#     anything else (inject, …)        → blocker 'other'
#
# A blocker is not an error — the plugin still loads on the next boot — but the
# user who just clicked Install sees "restart required", which is exactly the
# experience this file avoids. So the entry stays minimal: every default lives
# in lib/index.js normalizeConfig(), where a missing key is the same as the
# documented default.
#
# ---------------------------------------------------------------------------
# Overriding a default
# ---------------------------------------------------------------------------
# Do NOT add a second insert row — two rows inserting the same loader entry id
# make cordis reject the composition and the plugin installs without
# registering. Add a TOP-LEVEL row instead: a patch row at column 0 targets the
# existing entry and merges into it.
#
#   - id: turn-cleanup
#     config:
#       enabled: false            # installed but inert (no listener at all)
#       tmpDirName: .scratch      # a different convention directory
#       patterns: ["probe-*"]     # a narrower set of temporary-file patterns
#       protectedSegments: [.git] # replaces (not extends) the default dirs
#       messageLocale: en         # language of the injected notice (auto|zh|en)
#       steerMode: steer          # same-turn nudge instead of a follow-up turn
#       backupRetention:
#         keep: 5
#
# Defaults, for reference (lib/index.js):
#   patterns           probe-* tmp-* scratch-* check-* check_* diag_*
#                      bench-* bench_* *.bak-*
#   protectedSegments  .git node_modules out dist build target vendor
#                      .venv __pycache__
#   tmpDirName .agent-tmp · scanDepth 4 · maxLogPaths 10 · maxSteerPaths 20
#   logFile "" (no text log) · stats true · statsFile "" ($DSH_HOME/logs)
#   messageLocale auto · steerMode followup
#   backupRetention { enabled true, keep 3, mode steer,
#                     requireOriginalPresent true, maxPrunePerTurn 50 }
- insert:
    - id: turn-cleanup
      name: dsh-turn-cleanup
